<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Portal</title>
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: #111;
      font-family: sans-serif;
      color: #fff;
    }
    h3 {
      font-size: 14px;
      margin: 4px 0 10px 0;
      text-align: center;
      color: #aaa;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    a {
      display: block;
      padding: 10px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #333;
      text-align: center;
    }
    /* Tuş takımıyla üzerine gelindiğinde yanan odak rengi */
    a:focus, a:hover {
      background: #0078d4;
      border-color: #fff;
      outline: none;
    }
  </style>
</head>
<body>
  <h3>HIZLI ERİŞİM</h3>
  <div class="grid">
    <a href="https://web.telegram.org/k/">Telegram</a>
    <a href="https://www.youtube.com/shorts">YouTube Shorts</a>
    <a href="https://www.tiktok.com/">TikTok</a>
    <a href="https://x.com/">X (Twitter)</a>
    <a href="https://eksisozluk.com/">Ekşi Sözlük</a>
    <a href="https://m.soundcloud.com/">SoundCloud</a>
  </div>
</body>
</html>
